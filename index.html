<title>Tablero de Inglés</title>

  var CATEGORY_ORDER = [];
  TOPICS.forEach(function (t) {
    if (CATEGORY_ORDER.indexOf(t.category) === -1) CATEGORY_ORDER.push(t.category);
  });

  var STORAGE_KEY = "tablero-ingles-progress-v1";
  var progress = loadProgress();

  function loadProgress() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
  }

  function topicStatus(id) {
    var p = progress[id];
    if (!p || p.attempts === 0) return "new";
    if (p.bestCorrect >= p.total) return "mastered";
    return "practiced";
  }

  var navEl = document.getElementById("topicNav");
  var boardEl = document.getElementById("board");
  var tallyEl = document.getElementById("tally");
  var overallCountEl = document.getElementById("overallCount");

  var current = { topic: null, qIndex: 0, correctCount: 0, answered: false, mode: null, finished: false };

  function renderNav() {
    navEl.innerHTML = "";
    CATEGORY_ORDER.forEach(function (cat) {
      var wrap = document.createElement("div");
      wrap.className = "category";
      var label = document.createElement("div");
      label.className = "category-label";
      label.textContent = cat;
      wrap.appendChild(label);
      TOPICS.filter(function (t) { return t.category === cat; }).forEach(function (t) {
        var btn = document.createElement("button");
        btn.className = "topic-btn" + (current.topic && current.topic.id === t.id ? " active" : "");
        var status = topicStatus(t.id);
        btn.innerHTML =
          '<span class="num mono">' + t.num + '</span>' +
          '<span class="label">' + t.title + '</span>' +
          '<span class="status-dot ' + (status === "mastered" ? "mastered" : status === "practiced" ? "practiced" : "") + '"></span>';
        btn.addEventListener("click", function () { startTopic(t); });
        wrap.appendChild(btn);
      });
      navEl.appendChild(wrap);
    });
  }

  function renderTally() {
    tallyEl.innerHTML = "";
    var masteredCount = 0;
    TOPICS.forEach(function (t) {
      var i = document.createElement("i");
      var st = topicStatus(t.id);
      if (st === "mastered") { i.className = "done"; masteredCount++; }
      tallyEl.appendChild(i);
    });
    overallCountEl.textContent = masteredCount + "/" + TOPICS.length + " temas dominados";
  }

  function normalize(s) {
    return s.trim().toLowerCase().replace(/[.!?]+$/, "").replace(/\s+/g, " ");
  }

  function checkFillAnswer(q, value) {
    var candidates = [q.answer].concat(q.alt || []);
    var v = normalize(value);
    return candidates.some(function (c) { return normalize(c) === v; });
  }

  function startTopic(topic) {
    current = { topic: topic, qIndex: 0, correctCount: 0, answered: false, mode: "lesson", finished: false };
    renderNav();
    renderLesson();
  }

  function restartQuiz(topic) {
    current = { topic: topic, qIndex: 0, correctCount: 0, answered: false, mode: "quiz", finished: false };
    renderNav();
    renderQuestion();
  }

  function showLesson() {
    current.mode = "lesson";
    renderLesson();
  }

  function beginQuiz() {
    current.mode = "quiz";
    renderQuestion();
  }

  function renderLesson() {
    var t = current.topic;
    boardEl.innerHTML = "";

    var eyebrow = document.createElement("div");
    eyebrow.className = "eyebrow";
    eyebrow.textContent = "Tema " + t.num + " · Explicación";
    boardEl.appendChild(eyebrow);

    var h2 = document.createElement("h2");
    h2.textContent = t.title;
    boardEl.appendChild(h2);

    var lessonBox = document.createElement("div");
    lessonBox.className = "lesson-content";
    lessonBox.innerHTML = t.lesson;
    boardEl.appendChild(lessonBox);

    var trucoBox = document.createElement("div");
    trucoBox.className = "truco-box";
    trucoBox.innerHTML = '<span class="tag">Truco</span><span>' + t.truco + "</span>";
    boardEl.appendChild(trucoBox);

    var actions = document.createElement("div");
    actions.className = "actions-row";

    var startBtn = document.createElement("button");
    startBtn.className = "primary-btn";
    startBtn.textContent = current.finished ? "Repetir práctica" : (current.qIndex > 0 ? "Seguir practicando" : "Empezar práctica");
    startBtn.addEventListener("click", function () {
      if (current.finished) restartQuiz(t); else beginQuiz();
    });

    var backBtn = document.createElement("button");
    backBtn.className = "secondary-btn";
    backBtn.textContent = "Volver a temas";
    backBtn.addEventListener("click", function () { current.topic = null; renderNav(); renderIntro(); });

    actions.appendChild(startBtn);
    actions.appendChild(backBtn);
    boardEl.appendChild(actions);
  }

  function renderIntro() {
    boardEl.innerHTML = "";
    var wrap = document.createElement("div");
    wrap.className = "intro";
    wrap.innerHTML =
      '<div class="eyebrow">Elige un tema en el panel de la izquierda</div>' +
      '<h2>Bienvenido a tu tablero de práctica</h2>' +
      '<p style="color:var(--ink-soft); max-width:52ch;">Cada tema trae una explicación corta para refrescar la memoria, su truco y unas preguntas cortas para practicar. Tu avance se guarda automáticamente en este navegador.</p>';
    boardEl.appendChild(wrap);
  }

  function renderQuestion() {
    var t = current.topic;
    var q = t.questions[current.qIndex];
    current.answered = false;
    boardEl.innerHTML = "";

    var eyebrowRow = document.createElement("div");
    eyebrowRow.className = "eyebrow-row";
    var eyebrow = document.createElement("div");
    eyebrow.className = "eyebrow";
    eyebrow.textContent = "Tema " + t.num + " · " + t.title;
    var lessonLink = document.createElement("button");
    lessonLink.className = "lesson-link";
    lessonLink.textContent = "📖 Explicación";
    lessonLink.addEventListener("click", showLesson);
    eyebrowRow.appendChild(eyebrow);
    eyebrowRow.appendChild(lessonLink);
    boardEl.appendChild(eyebrowRow);

    var trucoBox = document.createElement("div");
    trucoBox.className = "truco-box";
    trucoBox.innerHTML = '<span class="tag">Truco</span><span>' + t.truco + "</span>";
    boardEl.appendChild(trucoBox);

    var qProgress = document.createElement("div");
    qProgress.className = "q-progress mono";
    qProgress.textContent = "Pregunta " + (current.qIndex + 1) + " de " + t.questions.length;
    boardEl.appendChild(qProgress);

    var card = document.createElement("div");
    card.className = "q-card";

    var prompt = document.createElement("div");
    prompt.className = "q-prompt";
    prompt.innerHTML = q.prompt;
    card.appendChild(prompt);

    var feedbackHolder = document.createElement("div");

    if (q.type === "mc") {
      var opts = document.createElement("div");
      opts.className = "options";
      q.options.forEach(function (optText, i) {
        var b = document.createElement("button");
        b.className = "option-btn";
        b.textContent = optText;
        b.addEventListener("click", function () { answerMC(q, i, opts, feedbackHolder); });
        opts.appendChild(b);
      });
      card.appendChild(opts);
    } else {
      var row = document.createElement("div");
      row.className = "fill-row";
      var lbl = document.createElement("label");
      lbl.textContent = "Escribe tu respuesta:";
      lbl.setAttribute("for", "fillInput");
      var input = document.createElement("input");
      input.type = "text";
      input.id = "fillInput";
      input.autocomplete = "off";
      input.spellcheck = false;
      row.appendChild(lbl);
      row.appendChild(input);
      var checkBtn = document.createElement("button");
      checkBtn.className = "primary-btn";
      checkBtn.textContent = "Verificar";
      checkBtn.addEventListener("click", function () { answerFill(q, input, checkBtn, feedbackHolder); });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !current.answered) answerFill(q, input, checkBtn, feedbackHolder);
      });
      row.appendChild(checkBtn);
      card.appendChild(row);
    }

    card.appendChild(feedbackHolder);
    boardEl.appendChild(card);

    var actions = document.createElement("div");
    actions.className = "actions-row";
    var backBtn = document.createElement("button");
    backBtn.className = "secondary-btn";
    backBtn.textContent = "Volver a temas";
    backBtn.addEventListener("click", function () { current.topic = null; renderNav(); renderIntro(); });
    actions.appendChild(backBtn);
    boardEl.appendChild(actions);
  }

  function showFeedback(holder, isCorrect, explain, correctText) {
    var box = document.createElement("div");
    box.className = "feedback " + (isCorrect ? "correct" : "incorrect");
    var line1 = document.createElement("div");
    line1.className = "answer-line";
    line1.textContent = isCorrect ? "¡Correcto!" : "No es así. Respuesta correcta: " + correctText;
    var line2 = document.createElement("div");
    line2.className = "explain";
    line2.innerHTML = explain;
    box.appendChild(line1);
    box.appendChild(line2);
    holder.innerHTML = "";
    holder.appendChild(box);

    var nextBtn = document.createElement("button");
    nextBtn.className = "primary-btn";
    nextBtn.style.marginTop = "10px";
    nextBtn.textContent = current.qIndex + 1 < current.topic.questions.length ? "Siguiente pregunta" : "Ver resultado";
    nextBtn.addEventListener("click", advance);
    holder.appendChild(nextBtn);
    nextBtn.focus();
  }

  function answerMC(q, chosenIndex, optsEl, feedbackHolder) {
    if (current.answered) return;
    current.answered = true;
    var isCorrect = chosenIndex === q.answer;
    if (isCorrect) current.correctCount++;
    Array.prototype.forEach.call(optsEl.children, function (btn, i) {
      btn.disabled = true;
      if (i === q.answer) btn.classList.add("correct");
      else if (i === chosenIndex) btn.classList.add("incorrect");
    });
    showFeedback(feedbackHolder, isCorrect, q.explain, q.options[q.answer]);
  }

  function answerFill(q, input, checkBtn, feedbackHolder) {
    if (current.answered) return;
    if (!input.value.trim()) { input.focus(); return; }
    current.answered = true;
    var isCorrect = checkFillAnswer(q, input.value);
    if (isCorrect) current.correctCount++;
    input.disabled = true;
    checkBtn.disabled = true;
    input.classList.add(isCorrect ? "correct" : "incorrect");
    showFeedback(feedbackHolder, isCorrect, q.explain, q.answer);
  }

  function advance() {
    var t = current.topic;
    if (current.qIndex + 1 < t.questions.length) {
      current.qIndex++;
      renderQuestion();
    } else {
      finishTopic();
    }
  }

  function finishTopic() {
    var t = current.topic;
    var total = t.questions.length;
    var correct = current.correctCount;

    var prev = progress[t.id] || { attempts: 0, bestCorrect: 0, total: total };
    prev.attempts++;
    prev.total = total;
    prev.bestCorrect = Math.max(prev.bestCorrect, correct);
    progress[t.id] = prev;
    saveProgress();

    current.finished = true;

    renderNav();
    renderTally();

    boardEl.innerHTML = "";
    var wrap = document.createElement("div");
    wrap.className = "summary";
    var eyebrow = document.createElement("div");
    eyebrow.className = "eyebrow";
    eyebrow.textContent = "Tema " + t.num + " · " + t.title + " — resultado";
    wrap.appendChild(eyebrow);

    var score = document.createElement("div");
    score.className = "score mono";
    score.innerHTML = correct + " <span>/ " + total + "</span>";
    wrap.appendChild(score);

    var msg = document.createElement("p");
    msg.style.color = "var(--ink-soft)";
    msg.style.maxWidth = "52ch";
    msg.textContent = correct === total
      ? "¡Tema dominado! Repite cuando quieras para reforzarlo."
      : "Vas bien. Repite el tema para mejorar tu marca o sigue con otro.";
    wrap.appendChild(msg);

    var trucoBox = document.createElement("div");
    trucoBox.className = "truco-box";
    trucoBox.innerHTML = '<span class="tag">Recuerda</span><span>' + t.truco + "</span>";
    wrap.appendChild(trucoBox);

    var actions = document.createElement("div");
    actions.className = "summary-actions";
    var retryBtn = document.createElement("button");
    retryBtn.className = "primary-btn";
    retryBtn.textContent = "Repetir tema";
    retryBtn.addEventListener("click", function () { restartQuiz(t); });
    var lessonBtn = document.createElement("button");
    lessonBtn.className = "secondary-btn";
    lessonBtn.textContent = "📖 Ver explicación";
    lessonBtn.addEventListener("click", showLesson);
    var backBtn = document.createElement("button");
    backBtn.className = "secondary-btn";
    backBtn.textContent = "Volver a temas";
    backBtn.addEventListener("click", function () { current.topic = null; renderNav(); renderIntro(); });
    actions.appendChild(retryBtn);
    actions.appendChild(lessonBtn);
    actions.appendChild(backBtn);
    wrap.appendChild(actions);

    boardEl.appendChild(wrap);
  }

  renderNav();
  renderTally();
  renderIntro();
})();
</script>
